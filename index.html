  <!-- Cookie Consent Styling -->
  <style>
    .rj-cookie-banner,
    .rj-cookie-banner * {
      box-sizing: border-box;
    }

    .rj-cookie-banner {
      position: fixed;
      bottom: 18px;

    .rj-cookie-accept {

    }

    .rj-cookie-reject {

    .rj-cookie-button:focus-visible {

    }

        padding: 16px;
      }

        flex-direction: column;
      }

        width: 100%;
      }
    }
  </style>

<body>

  <!-- React Application -->
  <div id="root"></div>

  <!-- Cookie Consent Banner -->
  <div
    id="rj-cookie-banner"

    role="dialog"
    aria-labelledby="rj-cookie-heading"
    aria-modal="false"
    hidden

    <h2

      to understand website visits and improve your

      You can accept or reject analytics cookies.

    </p>

    <div class="rj-cookie-actions">

      <button
        id="rj-cookie-accept"
        class="rj-cookie-button rj-cookie-accept"
        type="button"
      >
        Accept Analytics
      </button>

      <button
        id="rj-cookie-reject"
        class="rj-cookie-button rj-cookie-reject"
        type="button"
      >
        Reject Analytics
      </button>

    </div>
  </div>

  <!-- Google Analytics with Consent -->
  <script>
    (function () {
      "use strict";

      const MEASUREMENT_ID = "G-08L67ZJ05H";

      // Existing key preserves earlier visitor choices.
      const STORAGE_KEY = "rj_analytics_consent_v1";

      const banner = document.getElementById(
        "rj-cookie-banner"
      );

      const acceptButton = document.getElementById(
        "rj-cookie-accept"
      );

      const rejectButton = document.getElementById(
        "rj-cookie-reject"
      );

      let analyticsLoaded = false;

      window.dataLayer = window.dataLayer || [];

      window.gtag = window.gtag || function () {
        window.dataLayer.push(arguments);
      };

      const deniedConsent = {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied"
      };

      // Deny analytics by default.
      window.gtag(
        "consent",
        "default",
        deniedConsent
      );

      // Read saved choice.
      function readConsent() {
        try {
          const value = localStorage.getItem(
            STORAGE_KEY
          );

          if (
            value === "accepted" ||
            value === "rejected"
          ) {
            return value;
          }

          return null;
        } catch (error) {
          return null;
        }
      }

      // Save choice.
      function saveConsent(value) {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            value
          );
        } catch (error) {
          // Storage may be disabled by the browser.
        }
      }

      // Enable Google Analytics only after consent.
      function enableAnalytics() {
        if (analyticsLoaded) {
          return;
        }

        analyticsLoaded = true;

        window.gtag("consent", "update", {
          ...deniedConsent,
          analytics_storage: "granted"
        });

        window.gtag("js", new Date());

        window.gtag(
          "config",
          MEASUREMENT_ID,
          {
            send_page_view: true,
            page_location:
              window.location.origin +
              window.location.pathname
          }
        );

        const script = document.createElement(
          "script"
        );

        script.async = true;

        script.src =
          "https://www.googletagmanager.com/gtag/js?id=" +
          encodeURIComponent(MEASUREMENT_ID);

        document.head.appendChild(script);
      }

      // Remove accessible GA cookies on rejection.
      function clearAnalyticsCookies() {
        const cookieNames = document.cookie
          .split(";")
          .map(function (cookie) {
            return cookie.split("=")[0].trim();
          })
          .filter(function (name) {
            return (
              name === "_ga" ||
              name.startsWith("_ga_") ||
              name === "_gid" ||
              name === "_gat"
            );
          });

        const hostname = window.location.hostname;

        const rootDomain = hostname.replace(
          /^www\./i,
          ""
        );

        const domains = [
          "",
          hostname,
          "." + rootDomain
        ];

        cookieNames.forEach(function (name) {
          domains.forEach(function (domain) {
            let cookie =
              name +
              "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";

            if (domain) {
              cookie += "; domain=" + domain;
            }

            document.cookie = cookie;
          });
        });
      }

      // Accept or Reject handler.
      function chooseConsent(value) {
        saveConsent(value);

        // Hide popup after user makes a choice.
        banner.hidden = true;

        if (value === "accepted") {
          enableAnalytics();
        } else {
          window.gtag(
            "consent",
            "update",
            deniedConsent
          );

          clearAnalyticsCookies();
        }
      }

      // Accept button.
      acceptButton.addEventListener(
        "click",
        function () {
          chooseConsent("accepted");
        }
      );

      // Reject button.
      rejectButton.addEventListener(
        "click",
        function () {
          chooseConsent("rejected");
        }
      );

      // Check consent when website loads.
      const savedConsent = readConsent();

      if (savedConsent === "accepted") {

        // Previous visitor accepted.
        // Do not show popup.
        enableAnalytics();

      } else if (savedConsent === "rejected") {

        // Previous visitor rejected.
        // Do not show popup.
        // Do not load analytics.
        clearAnalyticsCookies();

      } else {

        // First visit: ask user once.
        banner.hidden = false;

      }

    })();
  </script>

</body>
