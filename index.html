  <!-- Cookie Consent Styling -->
  <style>
    .rj-cookie-banner,
    .rj-cookie-settings {
      font-family: Arial, Helvetica, sans-serif;
      box-sizing: border-box;
    }

    .rj-cookie-banner *,
    .rj-cookie-settings * {
      box-sizing: border-box;
    }

    .rj-cookie-banner {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      max-width: 680px;
      margin: 0 auto;
      padding: 22px;
      background: #211718;
      color: #ffffff;
      border: 1px solid #c7a86b;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      z-index: 99999;
    }

    .rj-cookie-banner[hidden],
    .rj-cookie-settings[hidden] {
      display: none !important;
    }

    .rj-cookie-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 10px;
      color: #e6c889;
    }

    .rj-cookie-text {
      font-size: 13px;

    .rj-cookie-actions {

      gap: 10px;
    }

    .rj-cookie-button {
      padding: 11px 18px;
      border-radius: 8px;
      border: 1px solid #c7a86b;

      font-weight: 700;
      cursor: pointer;
    }

    .rj-cookie-accept {

      color: #211718;
    }

    .rj-cookie-reject {
      background: transparent;
      color: #ffffff;
    }

    .rj-cookie-button:focus-visible,
    .rj-cookie-settings:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .rj-cookie-settings {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 99998;
      padding: 8px 12px;
      background: #211718;
      color: #ffffff;
      border: 1px solid #c7a86b;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .rj-cookie-banner {
        bottom: 10px;
        left: 10px;
        right: 10px;
        padding: 16px;
      }

      }

<body>

  <!-- React Application -->
  <div id="root"></div>

  <!-- Reopen Cookie Preferences -->
  <button

    type="button"
    hidden
  >
    Cookie Settings
  </button>

  <!-- Google Analytics 4 with Consent -->
  <script>
    (function () {
      "use strict";

      const MEASUREMENT_ID = "G-08L67ZJ05H";
      const STORAGE_KEY = "rj_analytics_consent_v1";

      const banner = document.getElementById(
        "rj-cookie-banner"
      );

      const settingsButton = document.getElementById(
        "rj-cookie-settings"
      );

      const acceptButton = document.getElementById(
        "rj-cookie-accept"
      );

      const rejectButton = document.getElementById(
        "rj-cookie-reject"
      );

      let analyticsLoaded = false;

      // Google Consent Mode defaults
      window.dataLayer = window.dataLayer || [];

      window.gtag = function () {
        window.dataLayer.push(arguments);
      };

      window.gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied"
      });

      function readConsent() {
        try {
          const value = localStorage.getItem(STORAGE_KEY);

          if (
            value === "accepted" ||
            value === "rejected"
          ) {
            return value;
          }

          return null;
        } catch (error) {
          return null;
        }
      }

      function saveConsent(value) {
        try {
          localStorage.setItem(STORAGE_KEY, value);
        } catch (error) {
          // Consent works for this page even if
          // browser storage is unavailable.
        }
      }

      function showBanner() {
        banner.hidden = false;
        settingsButton.hidden = true;
      }

      function hideBanner() {
        banner.hidden = true;
        settingsButton.hidden = false;
      }

      function enableAnalytics() {
        if (analyticsLoaded) {
          return;
        }

        analyticsLoaded = true;

        window.gtag("consent", "update", {
          analytics_storage: "granted",
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied"
        });

        window.gtag("js", new Date());

        window.gtag("config", MEASUREMENT_ID, {
          send_page_view: true,
          page_location:
            window.location.origin +
            window.location.pathname
        });

        const script = document.createElement("script");

        script.async = true;

        script.src =
          "https://www.googletagmanager.com/gtag/js?id=" +
          encodeURIComponent(MEASUREMENT_ID);

        document.head.appendChild(script);
      }

      function clearAnalyticsCookies() {
        const cookieNames = document.cookie
          .split(";")
          .map(function (cookie) {
            return cookie.split("=")[0].trim();
          })
          .filter(function (name) {
            return (
              name === "_ga" ||
              name.startsWith("_ga_") ||
              name === "_gid" ||
              name === "_gat"
            );
          });

        const hostname = window.location.hostname;

        const rootDomain = hostname.replace(
          /^www\./,
          ""
        );

        const domains = [
          "",
          hostname,
          "." + rootDomain
        ];

        cookieNames.forEach(function (name) {
          domains.forEach(function (domain) {
            let cookie =
              name +
              "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";

            if (domain) {
              cookie += "; domain=" + domain;
            }

            document.cookie = cookie;
          });
        });
      }

      acceptButton.addEventListener(
        "click",
        function () {
          saveConsent("accepted");
          hideBanner();
          enableAnalytics();
        }
      );

      rejectButton.addEventListener(
        "click",
        function () {
          const previousConsent = readConsent();

          saveConsent("rejected");

          window.gtag("consent", "update", {
            analytics_storage: "denied",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied"
          });

          hideBanner();

          if (previousConsent === "accepted") {
            clearAnalyticsCookies();
            window.location.reload();
          }
        }
      );

      settingsButton.addEventListener(
        "click",
        function () {
          showBanner();
        }
      );

      // Start analytics only with saved consent.
      const savedConsent = readConsent();

      if (savedConsent === "accepted") {
        hideBanner();
        enableAnalytics();
      } else if (savedConsent === "rejected") {
        hideBanner();
      } else {
        showBanner();
      }
    })();
  </script>

</body>
